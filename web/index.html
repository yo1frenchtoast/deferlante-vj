<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Déferlante</title>
<style>
  /* Dark by definition: this gets used in a dark room, often one-handed. */
  :root {
    --bg: #0a0a0c; --panel: #16161a; --line: #26262c;
    --text: #e8e8ec; --dim: #85858f; --accent: #ffb85c;
    --red: #ff7366; --green: #73ff80; --blue: #80a6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
    display: flex; flex-direction: column;
  }

  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: .8rem;
    padding: .5rem .9rem; border-bottom: 1px solid var(--line);
    padding-left: max(.9rem, env(safe-area-inset-left));
    padding-right: max(.9rem, env(safe-area-inset-right));
  }
  h1 { font-size: .95rem; margin: 0; letter-spacing: .08em; font-weight: 600; }
  .tabs { display: flex; gap: .3rem; margin-left: .4rem; }
  .tabs button {
    padding: .4rem .9rem; font-size: .8rem; letter-spacing: .04em;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .tabs button.on { color: #000; background: var(--accent); border-color: var(--accent); }
  #status { font-size: .75rem; color: var(--dim); margin-left: auto; }
  #status.on { color: var(--green); }
  #status.off { color: var(--red); }

  /* Vu-mètre: three bands, read at a glance and never touched, so it takes the
     smallest corner of the header rather than a row of its own. Hidden until the
     first packet arrives — an older Godot build simply never sends one. */
  .meter { display: flex; align-items: flex-end; gap: 3px; margin-left: .7rem; }
  .meter[hidden] { display: none; }
  .meter .bar {
    position: relative; width: 7px; height: 20px; overflow: hidden;
    background: var(--line); border-radius: 2px;
  }
  .meter .bar i {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    /* The levels land twenty times a second; the fill glides between them so the
       bar reads as a level rather than as a strobe. */
    transition: height .07s linear;
  }
  .meter .bass i { background: var(--red); }
  .meter .mid i { background: var(--accent); }
  .meter .treble i { background: var(--blue); }
  /* Turned all the way down: the bars still move, greyed. "It cannot hear you"
     and "you have not turned it up" are different problems and must look it. */
  .meter.idle .bar i { background: var(--dim); }
  .meter.deaf .bar { background: #3a2222; }
  /* Capturing, and nothing at all coming in — almost always the wrong source.
     A third state, because it looks identical to a quiet passage otherwise. */
  .meter.silent .bar { background: #3a3222; }
  .meter .amount {
    font-size: .7rem; color: var(--dim); margin-left: .3rem;
    font-variant-numeric: tabular-nums;
  }
  .meter.deaf .amount { color: var(--red); }
  .meter.silent .amount { color: var(--accent); }

  main { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
  .view { display: none; height: 100%; }
  .view.on { display: block; }
  .view.surfaces.on { display: flex; flex-direction: column; }

  /* Settings: sections become cards, and the cards flow into as many columns as
     the screen can take. Landscape on a tablet gives three or four. */
  .grid {
    display: grid; gap: .7rem; padding: .7rem;
    padding-left: max(.7rem, env(safe-area-inset-left));
    padding-right: max(.7rem, env(safe-area-inset-right));
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    align-items: start;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .6rem; padding: .5rem .7rem .7rem;
  }
  .card h2 {
    font-size: .68rem; letter-spacing: .16em; color: var(--accent);
    margin: .1rem 0 .4rem; font-weight: 600;
    /* The title is the handle. A card is nothing but sliders below this line, and
       one that moved when a slider was grabbed would be unusable — so the grip is
       the one strip of a card that does nothing else. */
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .card h2::after {
    content: "\2059"; float: right; color: var(--line);
    letter-spacing: 0; font-size: .9rem; line-height: .8;
  }
  .card.dragging {
    opacity: .9; border-color: var(--accent); box-shadow: 0 .5rem 1.5rem #000a;
    position: relative; z-index: 5;
    /* Transparent to hit-testing while carried, so the card under the finger can
       be read rather than the one being moved. */
    pointer-events: none;
  }
  .card.dragging h2 { cursor: grabbing; }

  /* Only offered once the order has actually been changed: nothing to reset
     otherwise, and the row is quieter for its absence. */
  .reorder-reset {
    display: block; margin: 0 auto .9rem; padding: .35rem .8rem;
    font-size: .68rem; letter-spacing: .1em;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: .4rem;
  }
  .reorder-reset[hidden] { display: none; }

  .row { padding: .12rem 0; }
  .row .top { display: flex; justify-content: space-between; font-size: .78rem; }
  .row .name { color: var(--dim); letter-spacing: .04em; }
  .row .val { font-variant-numeric: tabular-nums; }
  .row.red .name { color: var(--red); }
  .row.green .name { color: var(--green); }
  .row.blue .name { color: var(--blue); }

  /* Tall thumbs: this is driven with a thumb, not a mouse pointer. */
  input[type=range] { width: 100%; height: 30px; -webkit-appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line); border-radius: 3px; }
  input[type=range]::-moz-range-track { height: 4px; background: var(--line); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: var(--text);
  }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--text); }

  /* Surfaces: the pads get the room, which is the whole point of a second page. */
  .surfaces { gap: .6rem; padding: .7rem; }
  .strip { flex: 0 0 auto; display: flex; gap: .5rem; }
  .strip button {
    flex: 1; padding: .7rem; font-size: .82rem; letter-spacing: .06em;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .strip button:active { background: var(--accent); color: #000; }

  .slots {
    flex: 0 0 auto; display: flex; gap: .4rem; align-items: center;
    padding: .5rem .9rem; border-bottom: 1px solid var(--line);
    padding-left: max(.9rem, env(safe-area-inset-left));
    padding-right: max(.9rem, env(safe-area-inset-right));
  }
  .slots .label { flex: 0 0 auto; font-size: .68rem; letter-spacing: .14em; color: var(--accent); }
  .slots button {
    flex: 1; padding: .5rem 0; font-size: .88rem; font-variant-numeric: tabular-nums;
    background: transparent; color: #4a4a52;
    /* An empty slot is dashed: somewhere to put a look, not a dead button. */
    border: 1px dashed var(--line); border-radius: .5rem;
    /* Holding a button with a label in it can start a text selection or a drag,
       and the browser then fires pointercancel — which was killing the very
       long-press the hold is for. */
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  /* Held long enough to count: the slot fills before the finger lifts, so the
     save is confirmed by the gesture rather than only after it. */
  .slots button.arming { background: var(--accent); color: #000; border-style: solid; }
  .slots button.stored { animation: stored .5s ease-out; }
  @keyframes stored {
    from { background: var(--green); color: #000; }
    to { background: var(--panel); }
  }
  .slots button.used {
    color: var(--text); background: var(--panel);
    border-style: solid; border-color: var(--accent);
  }
  .slots button:active { background: var(--accent); color: #000; }
  .slots .hint { flex: 0 0 auto; font-size: .66rem; color: var(--dim); padding-left: .2rem; }
  /* The way every lighting desk does it: arm STORE, then pick a slot. No timing,
     no gesture to get right, and it works the same on a mouse and a thumb. */
  .slots .store {
    flex: 0 0 auto; padding: .5rem .8rem; font-size: .7rem; letter-spacing: .1em;
    border-style: solid; color: var(--dim);
  }
  .slots .store.armed { background: var(--red); border-color: var(--red); color: #000; }

  .pads { flex: 1 1 auto; display: flex; gap: .6rem; min-height: 200px; }
  .pad {
    flex: 1; display: flex; flex-direction: column; gap: .35rem;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: .6rem; padding: .5rem; min-width: 0;
  }
  .pad select {
    width: 100%; background: #0e0e12; color: var(--text);
    border: 1px solid var(--line); border-radius: .35rem; padding: .3rem; font-size: .72rem;
  }
  .surface {
    flex: 1 1 auto; position: relative; min-height: 120px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 25%,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 25% 100%,
      #0e0e12;
    border-radius: .45rem; touch-action: none; overflow: hidden;
  }
  .dot {
    position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%; background: var(--accent); opacity: .9;
    box-shadow: 0 0 18px var(--accent); pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <h1>DÉFERLANTE</h1>
  <div class="tabs">
    <button data-view="settings" class="on">RÉGLAGES</button>
    <button data-view="surfaces">SURFACES</button>
  </div>
  <span id="status">connecting…</span>
  <div class="meter" id="meter" hidden title="Vu-mètre : basses · médiums · aigus">
    <div class="bar bass"><i></i></div>
    <div class="bar mid"><i></i></div>
    <div class="bar treble"><i></i></div>
    <span class="amount" id="amount">0%</span>
  </div>
</header>

<!-- Presets live above the tabs, not inside one: they are the control reached for
     most often in a set, and hiding them behind a tab meant hunting for them at
     exactly the wrong moment. -->
<div class="slots" id="slots"></div>

<main>
  <section class="view settings on" id="settings">
    <div class="grid" id="grid"></div>
    <button class="reorder-reset" id="reorder-reset" hidden>ordre par défaut</button>
  </section>

  <section class="view surfaces" id="surfaces">
    <div class="strip">
      <button data-action="glitch">GLITCH</button>
      <button data-action="randomize">COLORS</button>
    </div>
    <div class="pads" id="pads"></div>
  </section>
</main>

<script>
"use strict";

// The page knows nothing in advance: Godot sends the list of settings on connect
// and everything below is built from it. Adding a setting in Godot makes it appear
// here with no change to this file.
let params = new Map();
let rows = new Map();
let socket = null;
const pads = [];

const statusEl = document.getElementById("status");

function connect() {
  socket = new WebSocket(`ws://${location.hostname}:${Number(location.port || 80) + 1}`);
  socket.onopen = () => { statusEl.textContent = "live"; statusEl.className = "on"; };
  socket.onclose = () => {
    statusEl.textContent = "reconnecting…"; statusEl.className = "off";
    // A frozen bar looks exactly like a live one, so the levels drop with the
    // socket rather than sitting there lying about the sound.
    if (!meterEl.hidden) meter({ capturing: false, reactivity: 0 });
    // A phone that sleeps drops the socket; coming back should not need a reload.
    setTimeout(connect, 1200);
  };
  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "schema") build(msg);
    else if (msg.type === "value") apply(msg.slug, msg.value);
    else if (msg.type === "audio") meter(msg);
  };
}

function send(payload) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
}

// Kept identical to VJParam.format_value() in GDScript: the phone and the panel
// must never disagree about what a value reads as.
function format(p, value) {
  if (p.choices && p.choices.length) return p.choices[Math.min(p.choices.length - 1, Math.round(value))];
  if (p.bidirectional) {
    if (value > 0.0005) return "→ " + value.toFixed(2);
    if (value < -0.0005) return "← " + Math.abs(value).toFixed(2);
    return "·  0.00";
  }
  if (p.step >= 1) return String(Math.round(value));
  if (p.step < 0.01) return value.toFixed(3);
  return value.toFixed(2);
}

const TINTS = { "color/red": "red", "color/green": "green", "color/blue": "blue" };

// ---------------------------------------------------------------------------
// Where the cards sit
// ---------------------------------------------------------------------------
//
// Which section you reach for first changes with the set, and with whether the
// tablet is in a hand or flat on a table. So the order is the operator's: dragged
// by the card title, kept in this browser, and reapplied to every schema. Godot
// has no opinion about it and is never told — this is a property of the surface
// you happen to be holding, not of the show.
const ORDER_KEY = "deferlante.card-order";
const resetEl = document.getElementById("reorder-reset");
// The order Godot sent, before any of it was rearranged: the one description of
// "default" that cannot drift, since it is rebuilt from the schema every connect.
let defaultOrder = [];

function savedOrder() {
  // Private windows and cleared site data both throw rather than return nothing.
  try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch (e) { return []; }
}

function rememberOrder(grid) {
  const order = [...grid.children].map((card) => card.dataset.section);
  try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch (e) { /* not fatal */ }
  resetEl.hidden = false;
}

function applyOrder(grid) {
  const order = savedOrder();
  if (!order.length) return;
  const rank = new Map(order.map((name, i) => [name, i]));
  // A section the saved order has never heard of — one just added in Godot — sorts
  // to the end rather than vanishing or forcing the whole order to be thrown away.
  [...grid.children]
    .sort((a, b) => (rank.get(a.dataset.section) ?? 1e6) - (rank.get(b.dataset.section) ?? 1e6))
    .forEach((card) => grid.appendChild(card));
  resetEl.hidden = false;
}

resetEl.addEventListener("click", () => {
  try { localStorage.removeItem(ORDER_KEY); } catch (e) { /* not fatal */ }
  resetEl.hidden = true;
  const grid = document.getElementById("grid");
  const rank = new Map(defaultOrder.map((name, i) => [name, i]));
  [...grid.children]
    .sort((a, b) => (rank.get(a.dataset.section) ?? 1e6) - (rank.get(b.dataset.section) ?? 1e6))
    .forEach((card) => grid.appendChild(card));
});

function makeDraggable(card, grid) {
  const handle = card.querySelector("h2");
  let pointer = null, startX = 0, startY = 0, moved = false;

  handle.addEventListener("pointerdown", (event) => {
    pointer = event.pointerId;
    startX = event.clientX; startY = event.clientY;
    moved = false;
    // Without the capture the smallest drift hands the events to whatever the
    // finger has slid over, and the card is dropped mid-move.
    try { handle.setPointerCapture(pointer); } catch (e) { /* not fatal */ }
  });

  handle.addEventListener("pointermove", (event) => {
    if (event.pointerId !== pointer) return;
    const dx = event.clientX - startX, dy = event.clientY - startY;
    // A few pixels of slack: a thumb never presses perfectly still, and a tap on
    // a title should not count as a drag.
    if (!moved && Math.hypot(dx, dy) < 6) return;
    if (!moved) { moved = true; card.classList.add("dragging"); }
    card.style.transform = `translate(${dx}px, ${dy}px)`;

    const under = document.elementFromPoint(event.clientX, event.clientY);
    const target = under && under.closest(".card");
    if (!target || target === card || target.parentElement !== grid) return;
    // Which side to land on is read from the order the two are already in, not
    // from the geometry: in a grid the neighbour can be beside rather than below,
    // and comparing midpoints there flickers between two slots.
    const cards = [...grid.children];
    const after = cards.indexOf(target) > cards.indexOf(card);
    grid.insertBefore(card, after ? target.nextSibling : target);
    // The card just moved out from under the finger. Keeping the old offset would
    // fling it the width of a column away.
    startX = event.clientX; startY = event.clientY;
    card.style.transform = "";
  });

  const drop = (event) => {
    if (event.pointerId !== pointer) return;
    pointer = null;
    card.style.transform = "";
    if (moved) { card.classList.remove("dragging"); rememberOrder(grid); }
    moved = false;
  };
  handle.addEventListener("pointerup", drop);
  handle.addEventListener("pointercancel", drop);
}

function build(schema) {
  params = new Map();
  rows = new Map();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let card = null;
  let section = null;
  for (const p of schema.params) {
    params.set(p.slug, p);
    if (p.section !== section) {
      section = p.section;
      card = document.createElement("div");
      card.className = "card";
      card.dataset.section = section;
      const h = document.createElement("h2");
      h.textContent = section;
      card.appendChild(h);
      grid.appendChild(card);
      makeDraggable(card, grid);
    }

    const row = document.createElement("div");
    row.className = "row" + (TINTS[p.slug] ? " " + TINTS[p.slug] : "");
    const top = document.createElement("div");
    top.className = "top";
    const name = document.createElement("span");
    name.className = "name"; name.textContent = p.label;
    const val = document.createElement("span");
    val.className = "val"; val.textContent = format(p, p.value);
    top.append(name, val);

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = p.min; slider.max = p.max; slider.step = p.step; slider.value = p.value;
    slider.addEventListener("input", () => {
      const v = parseFloat(slider.value);
      val.textContent = format(p, v);
      send({ type: "set", slug: p.slug, value: v });
    });

    row.append(top, slider);
    card.appendChild(row);
    rows.set(p.slug, { slider, val, p });
  }

  defaultOrder = [...grid.children].map((card) => card.dataset.section);
  applyOrder(grid);
  buildPads(schema.params);
  buildPresets(schema.presets);
  statusEl.textContent = "live"; statusEl.className = "on";
}

// A value changed somewhere else — the keyboard, OSC, the auto-pilot. We mirror it
// without echoing back, otherwise two surfaces would fight over the same setting.
function apply(slug, value) {
  const row = rows.get(slug);
  if (!row) return;
  row.slider.value = value;
  row.val.textContent = format(row.p, value);
  for (const pad of pads) pad.refresh();
}

// The vu-mètre. Godot has already done the smoothing and the scaling, so all this
// does is draw: three fills and the reactivity next to them.
const meterEl = document.getElementById("meter");
const amountEl = document.getElementById("amount");
const fills = {
  bass: meterEl.querySelector(".bass i"),
  mid: meterEl.querySelector(".mid i"),
  treble: meterEl.querySelector(".treble i"),
};

function meter(msg) {
  meterEl.hidden = false;
  const deaf = !msg.capturing;
  // Three failures that look alike on flat bars: no capture at all, a capture
  // carrying nothing, and a capture nobody has turned up. Each says which.
  const silent = !deaf && msg.silent === true;
  const react = msg.reactivity || 0;
  meterEl.classList.toggle("deaf", deaf);
  meterEl.classList.toggle("silent", silent);
  meterEl.classList.toggle("idle", react <= 0);
  for (const band of ["bass", "mid", "treble"]) {
    const level = deaf ? 0 : Math.min(1, Math.max(0, msg[band] || 0));
    fills[band].style.height = (level * 100) + "%";
  }
  amountEl.textContent = deaf ? "sourd"
    : silent ? "silence"
    : Math.round(react * 100) + "%";
}

// Preset slots. A tap recalls, a long press saves — the same gesture a hardware
// desk uses, and it needs no second button in a row that is already tight.
function buildPresets(info) {
  if (!info) return;
  const holder = document.getElementById("slots");
  holder.innerHTML = "";
  const used = new Set(info.used || []);

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = "PRESETS";
  holder.appendChild(label);

  // Arming STORE turns the next slot press into a save. A long press does the
  // same thing for anyone who prefers it, but this needs no timing to get right
  // and behaves identically under a mouse and under a thumb.
  const store = document.createElement("button");
  store.className = "store";
  store.textContent = "STORE";
  let armed = false;
  const setArmed = (on) => { armed = on; store.classList.toggle("armed", on); };
  store.addEventListener("click", () => setArmed(!armed));
  holder.appendChild(store);

  for (let slot = 1; slot <= (info.count || 9); slot++) {
    const button = document.createElement("button");
    button.textContent = slot;
    if (used.has(slot)) button.classList.add("used");

    let timer = null, saved = false;

    button.addEventListener("pointerdown", (event) => {
      saved = false;
      // Capture the pointer so the press stays bound to this button: without it
      // the smallest drift can hand the events elsewhere mid-hold.
      if (button.setPointerCapture) {
        try { button.setPointerCapture(event.pointerId); } catch (e) { /* not fatal */ }
      }
      event.preventDefault();
      timer = setTimeout(() => {
        saved = true;
        send({ type: "action", name: `preset:save:${slot}` });
        // A save is silent otherwise, and holding a button with no feedback
        // feels like nothing happened.
        markStored();
      }, 600);
      button.classList.add("arming");
    });

    const markStored = () => {
      button.classList.remove("arming");
      button.classList.add("used", "stored");
      setTimeout(() => button.classList.remove("stored"), 500);
      used.add(slot);
      if (navigator.vibrate) navigator.vibrate(40);
    };

    const release = () => {
      clearTimeout(timer);
      button.classList.remove("arming");
      if (!saved) {
        if (armed) {
          send({ type: "action", name: `preset:save:${slot}` });
          markStored();
          setArmed(false);
        } else if (used.has(slot)) {
          send({ type: "action", name: `preset:recall:${slot}` });
        }
      }
      saved = false;
    };
    button.addEventListener("pointerup", release);
    // Only a real cancel stops the hold now; pointerleave is deliberately not
    // listened for, since the capture above keeps the pointer on the button.
    button.addEventListener("pointercancel", () => {
      clearTimeout(timer);
      button.classList.remove("arming");
    });
    holder.appendChild(button);
  }

  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = "tap recall · STORE then a slot to save";
  holder.appendChild(hint);
}

// Two XY pads. Each axis is assignable, because which pair is worth playing with
// changes from one track to the next.
const PAD_DEFAULTS = [["global/chaos", "global/speed"], ["spot/radius", "spot/pulse"]];

function buildPads(list) {
  const holder = document.getElementById("pads");
  holder.innerHTML = "";
  pads.length = 0;

  PAD_DEFAULTS.forEach((defaults) => {
    const pad = document.createElement("div");
    pad.className = "pad";

    const pick = (axis) => {
      const select = document.createElement("select");
      for (const p of list) {
        const option = document.createElement("option");
        option.value = p.slug;
        // The section matters: three of them have a WIDTH, and on a pad you are
        // picking blind from a list rather than reading a labelled row.
        option.textContent = (axis === 0 ? "X · " : "Y · ") + p.section + " " + p.label;
        select.appendChild(option);
      }
      select.value = defaults[axis];
      select.addEventListener("change", () => refresh());
      return select;
    };

    const selectX = pick(0), selectY = pick(1);
    const surface = document.createElement("div");
    surface.className = "surface";
    const dot = document.createElement("div");
    dot.className = "dot";
    surface.appendChild(dot);
    pad.append(selectX, selectY, surface);
    holder.appendChild(pad);

    function refresh() {
      const px = params.get(selectX.value), py = params.get(selectY.value);
      if (!px || !py) return;
      const rx = rows.get(px.slug), ry = rows.get(py.slug);
      const fx = (parseFloat(rx.slider.value) - px.min) / (px.max - px.min);
      const fy = (parseFloat(ry.slider.value) - py.min) / (py.max - py.min);
      dot.style.left = (fx * 100) + "%";
      // Screen Y grows downwards; the pad reads bottom-up like a fader.
      dot.style.top = ((1 - fy) * 100) + "%";
    }

    function drag(event) {
      const rect = surface.getBoundingClientRect();
      const touch = event.touches ? event.touches[0] : event;
      const fx = Math.min(1, Math.max(0, (touch.clientX - rect.left) / rect.width));
      const fy = 1 - Math.min(1, Math.max(0, (touch.clientY - rect.top) / rect.height));
      for (const [select, fraction] of [[selectX, fx], [selectY, fy]]) {
        const p = params.get(select.value);
        if (!p) continue;
        let v = p.min + fraction * (p.max - p.min);
        if (p.step) v = Math.round(v / p.step) * p.step;
        apply(p.slug, v);
        send({ type: "set", slug: p.slug, value: v });
      }
      event.preventDefault();
    }

    let dragging = false;
    surface.addEventListener("pointerdown", (e) => { dragging = true; drag(e); });
    surface.addEventListener("pointermove", (e) => { if (dragging) drag(e); });
    for (const done of ["pointerup", "pointercancel", "pointerleave"]) {
      surface.addEventListener(done, () => { dragging = false; });
    }

    pads.push({ refresh });
    refresh();
  });
}

for (const button of document.querySelectorAll("[data-action]")) {
  button.addEventListener("click", () => send({ type: "action", name: button.dataset.action }));
}

// Tabs. The pads need the whole screen to be playable and the grid needs it to be
// readable; neither works squeezed above the other.
for (const tab of document.querySelectorAll("[data-view]")) {
  tab.addEventListener("click", () => {
    for (const other of document.querySelectorAll("[data-view]")) other.classList.remove("on");
    tab.classList.add("on");
    for (const view of document.querySelectorAll(".view")) view.classList.remove("on");
    document.getElementById(tab.dataset.view).classList.add("on");
    // The pads size themselves to the page, so they only know where the dot goes
    // once they are actually visible.
    for (const pad of pads) pad.refresh();
  });
}

connect();
</script>
</body>
</html>
